name: CI

# Roda a cada push e a cada pull request. Se algo quebrar, o GitHub avisa antes de ir para o ar.
on:
  push:
  pull_request:

jobs:
  api:
    name: pedidos-api (testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B test
        working-directory: pedidos-api

  pagamentos:
    name: pagamentos-py (testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pagamentos-py/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: pagamentos-py
      - run: python -m unittest -v
        working-directory: pagamentos-py

  front:
    name: front (lint e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
        working-directory: front
      - run: npm run lint
        working-directory: front
      - run: npm run build
        working-directory: front

  e2e:
    name: ponta a ponta (Kafka + Postgres + API + Pagamentos)
    runs-on: ubuntu-latest
    needs: [api, pagamentos]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sobe Postgres e Kafka (senhas do modelo, pois a máquina do CI é descartável)
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres kafka
        working-directory: infra

      - name: Sobe a API (o Flyway cria o esquema num banco vazio e o Hibernate o confere)
        run: |
          chmod +x mvnw
          nohup ./mvnw -B -q spring-boot:run > ../api.log 2>&1 &
        working-directory: pedidos-api

      - name: Sobe o Pagamentos
        run: |
          pip install -r requirements.txt
          nohup python app.py > ../pag.log 2>&1 &
        working-directory: pagamentos-py

      - name: Espera API e Pagamentos
        run: |
          for i in $(seq 1 60); do
            curl -fs localhost:8081/opcoes > /dev/null && curl -fs localhost:5001/saude > /dev/null && exit 0
            sleep 3
          done
          echo "API ou Pagamentos não subiram"; tail -50 api.log pag.log; exit 1

      - name: Teste de ponta a ponta
        run: bash scripts/e2e.sh

      - name: Logs (se falhou)
        if: failure()
        run: tail -100 api.log pag.log

  producao:
    name: producao (imagens Docker e pilha completa)
    runs-on: ubuntu-latest
    needs: [api, pagamentos, front]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configuração de teste (senhas do modelo; HTTP puro na porta 80)
        run: |
          cp deploy/.env.example deploy/.env
          sed -i 's/^SITE_ADDRESS=.*/SITE_ADDRESS=:80/' deploy/.env
          # Backup é obrigatório: gera um par de chaves só para este teste (a privada fica em /tmp, fora do repositório).
          bash deploy/gerar-chave-backup.sh /tmp/chave-ci.txt
          sed -i "s/^BACKUP_AGE_RECIPIENT=.*/BACKUP_AGE_RECIPIENT=$(sed -n 's/^# public key: //p' /tmp/chave-ci.txt)/" deploy/.env

      - name: Constrói as imagens e sobe a pilha de produção (Caddy, API, Pagamentos, Postgres, Kafka)
        run: docker compose -f deploy/compose.prod.yml up -d --build --wait

      - name: Saúde pelo Caddy
        run: |
          curl -fs http://localhost/api/saude
          curl -fs http://localhost/ > /dev/null

      - name: Teste de ponta a ponta contra a produção (pelo /api do Caddy)
        run: ENV_FILE=deploy/.env bash scripts/e2e.sh http://localhost/api

      - name: Backup e restauração na pilha de produção (o banco restaurado tem que ser idêntico ao original)
        run: |
          C="docker compose -f deploy/compose.prod.yml"
          $C exec -T backup backup.sh
          ARQ=$($C exec -T backup sh -c 'ls -1t /backups | grep "\.dump\.age$" | head -1' | tr -d '\r')
          echo "restaurando $ARQ"
          bash deploy/restaurar.sh "$ARQ" /tmp/chave-ci.txt
          Q="select (select count(*) from pedido) || '/' || (select count(*) from usuario) || '/' || coalesce((select sum(valor)::text from pedido),'0') || '/' || (select count(*) from auditoria)"
          ORIGINAL=$($C exec -T postgres psql -U loja -d loja_cafe -Atc "$Q")
          RESTAURADO=$($C exec -T postgres psql -U loja -d loja_cafe_restaurado -Atc "$Q")
          echo "original:   $ORIGINAL"; echo "restaurado: $RESTAURADO"
          [ "$ORIGINAL" = "$RESTAURADO" ] || { echo 'o banco restaurado é diferente do original'; exit 1; }
          bash deploy/status.sh || true

      - name: Atualizador (simulacao e atualizacao real para o commit atual)
        run: |
          bash deploy/atualizar.sh --simular --versao "$(git rev-parse HEAD)" --forcar
          bash deploy/atualizar.sh --versao "$(git rev-parse HEAD)" --forcar
          curl -fs http://localhost/api/saude

      - name: Logs (se falhou)
        if: failure()
        run: docker compose -f deploy/compose.prod.yml logs --tail=100

  backup:
    name: backup (cifra, cópia de fora, restauração, retenção)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Teste de backup e restauração num Postgres descartável
        run: bash scripts/testar-backup.sh

  specs:
    name: specs (o codigo e os contratos dizem a mesma coisa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir rotas, eventos, topicos, papeis e status contra specs/
        run: node scripts/conferir-specs.js
