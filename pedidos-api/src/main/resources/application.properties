spring.application.name=pedidos-api

# Credenciais: variáveis de ambiente ou infra/.env (modelo: infra/.env.example). Não há senha padrão no código.
spring.config.import=optional:file:../infra/.env[.properties]
server.port=8081

# Postgres do infra/compose.yml (porta 5433 no seu computador). Outro banco: DB_URL, DB_USER e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/loja_cafe}
spring.datasource.username=${DB_USER:${POSTGRES_USER:loja}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD}}
# O esquema é do Flyway (db/migration). O Hibernate só confere se as entidades batem com o banco: não altera nada.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Banco que já existia (antes do Flyway) vira "versão 1" e segue da V2 em diante.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Erro de validação (400) diz QUAL campo falhou, para o front mostrar.
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# Primeiro ADMIN da rede (criado só se ainda não houver nenhum). Vêm do infra/.env.
lojacafe.admin.email=${ADMIN_EMAIL:}
lojacafe.admin.senha=${ADMIN_PASSWORD:}

# Origem liberada no CORS.
lojacafe.cors.origem=http://localhost:5173

# Ato 3: Kafka (specs/eventos.md). Chave e valor viajam como texto (String). Login SASL/PLAIN do infra/.env.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.properties.security.protocol=SASL_PLAINTEXT
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USER}" password="${KAFKA_PASSWORD}";
spring.kafka.consumer.group-id=pedidos-api
# Grupo que nunca leu nada começa do início do tópico.
spring.kafka.consumer.auto-offset-reset=earliest
# Kafka fora do ar? Desiste em 5 s em vez de travar a requisição por 1 minuto.
spring.kafka.producer.properties.max.block.ms=5000
