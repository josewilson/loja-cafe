spring.application.name=pedidos-api
server.port=8081

# H2 em arquivo: reiniciar a API não apaga os pedidos.
spring.datasource.url=jdbc:h2:file:./dados/pedidos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Ato 3: Kafka (specs/eventos.md). Chave e valor viajam como texto (String).
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=pedidos-api
# Grupo que nunca leu nada começa do início do tópico.
spring.kafka.consumer.auto-offset-reset=earliest
# Kafka fora do ar? Desiste em 5 s em vez de travar a requisição por 1 minuto.
spring.kafka.producer.properties.max.block.ms=5000
