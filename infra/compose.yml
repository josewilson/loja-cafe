name: loja-cafe
# Postgres + Kafka + painel para a Loja Café. Os apps rodam no seu computador, fora do Docker.
# As senhas vêm de infra/.env (modelo: infra/.env.example). Sem elas, o compose nem sobe.
services:
  # Um único broker Kafka em modo KRaft (sem Zookeeper), com login SASL/PLAIN.
  # ponytail: SASL/PLAIN sem TLS só é seguro em porta local (127.0.0.1) ou rede privada; pela internet, usar SASL_SSL.
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Duas portas de entrada: 9092 para os apps no seu computador, 19092 para o painel (outro container).
      KAFKA_LISTENERS: HOST://:9092,INTERNO://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:${KAFKA_PORT:-9092},INTERNO://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:SASL_PLAINTEXT,INTERNO:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      # username/password = como o broker fala com ele mesmo; user_<nome>="senha" = quem pode entrar.
      KAFKA_LISTENER_NAME_HOST_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_USER:?defina KAFKA_USER em infra/.env}" password="${KAFKA_PASSWORD:?defina KAFKA_PASSWORD em infra/.env}"
        user_${KAFKA_USER}="${KAFKA_PASSWORD}";
      KAFKA_LISTENER_NAME_INTERNO_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_USER}" password="${KAFKA_PASSWORD}"
        user_${KAFKA_USER}="${KAFKA_PASSWORD}";
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Para o healthcheck abaixo (o $$ é lido pelo shell do container, não pelo compose).
      CLIENTE_USER: ${KAFKA_USER}
      CLIENTE_SENHA: ${KAFKA_PASSWORD}
    ports: ["127.0.0.1:${KAFKA_PORT:-9092}:9092"]
    volumes: ["dados-kafka:/var/lib/kafka/data"]
    healthcheck:
      test:
        - CMD-SHELL
        - |
          printf 'security.protocol=SASL_PLAINTEXT\nsasl.mechanism=PLAIN\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="%s" password="%s";\n' "$$CLIENTE_USER" "$$CLIENTE_SENHA" > /tmp/cliente.properties
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --command-config /tmp/cliente.properties --list
      interval: 5s
      timeout: 15s
      retries: 30
  # Banco de dados da pedidos-api. Porta 5433 no seu computador (a 5432 costuma estar ocupada).
  # DBeaver/Insomnia: localhost:5433 · banco loja_cafe · usuário e senha do infra/.env (pode criar outros bancos).
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: loja_cafe
      POSTGRES_USER: ${POSTGRES_USER:-loja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em infra/.env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    volumes: ["dados-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loja} -d loja_cafe"]
      interval: 5s
      timeout: 5s
      retries: 20
  # Painel do Kafka. Não tem login próprio: fica só em 127.0.0.1. Não exponha à internet.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    environment:
      KAFKA_CLUSTERS_0_NAME: loja-cafe
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: PLAIN
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_USER}" password="${KAFKA_PASSWORD}";
    ports: ["127.0.0.1:${KAFKA_UI_PORT:-8090}:8080"]
    depends_on:
      kafka:
        condition: service_healthy
volumes:
  dados-kafka:
  dados-postgres:
